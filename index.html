<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Alunos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background-color: #2e7d32;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1b5e20;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    /* LISTA ZEBRADA */
    li:nth-child(odd) {
      background-color: #ffffff;
    }

    li:nth-child(even) {
      background-color: #f2f2f2;
    }

    .mensagem {
      text-align: center;
      margin-top: 10px;
      color: green;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Cadastro de Alunos</h2>

    <input
      type="text"
      id="nome"
      placeholder="Digite o nome do aluno"
    >

    <button onclick="adicionarAluno()">
      Adicionar
    </button>

    <div class="mensagem" id="mensagem"></div>

    <ul id="lista"></ul>

  </div>

  <script>

    // COLE SUA URL DO APPS SCRIPT AQUI
    const URL =
      "https://script.google.com/macros/s/AKfycbx-kf0UHYNwE5I8fa2eBO4LcUa2CvUcBuJjoJftRgj_R05a9kZHid3I_DSbdQp4dNoJeQ/exec";

    async function adicionarAluno() {

      const nome =
        document.getElementById("nome").value.trim();

      if (!nome) {
        alert("Digite um nome");
        return;
      }

      try {

        await fetch(
          URL + "?nome=" + encodeURIComponent(nome)
        );

        document.getElementById("nome").value = "";

        document.getElementById("mensagem")
          .textContent = "Aluno adicionado!";

        carregarAlunos();

        setTimeout(() => {
          document.getElementById("mensagem")
            .textContent = "";
        }, 2000);

      } catch (erro) {

        console.error(erro);

        alert("Erro ao adicionar aluno");

      }
    }

    async function carregarAlunos() {

      try {

        const resposta = await fetch(URL);

        const alunos = await resposta.json();

        const lista =
          document.getElementById("lista");

        lista.innerHTML = "";

        alunos.forEach(nome => {

          const li =
            document.createElement("li");

          li.textContent = nome;

          lista.appendChild(li);

        });

      } catch (erro) {

        console.error(erro);

        alert("Erro ao carregar alunos");

      }
    }

    carregarAlunos();

  </script>

</body>
</html>
